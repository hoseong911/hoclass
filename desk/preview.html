<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 책상 미리보기</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #E3E7E5; --surface: #FFFFFF; --ink: #16201C; --muted: #5E6A65; --faint: #8E9994;
    --line: #D3DAD6; --accent: #0E7A5C; --accent-soft: #E1F0EA;
    --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { display: flex; flex-direction: column; }
  button, select { font: inherit; color: inherit; }

  .top { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .top .sp { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .btn:hover { color: var(--accent); border-color: var(--accent); }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.main:hover { filter: brightness(1.08); color: #fff; }

  .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 2.6fr) minmax(0, 1.35fr) minmax(0, .8fr); gap: 14px; padding: 14px 16px 16px; }
  .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .phead { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .phead b { font-size: 14px; }
  .phead select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px; font-size: 12.5px; min-width: 0; max-width: 100%; }
  .phead .scale { font-family: var(--num); font-size: 11.5px; color: var(--faint); }
  .phead .sp { flex: 1; }
  .phead .btn { padding: 4px 10px; font-size: 12px; }

  /* 창(iframe)은 진짜 크기로 만들고 transform 으로 줄인다. */
  .screen { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .device {
    position: absolute; left: 50%; top: 0; transform-origin: 0 0;
    background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(22, 32, 28, .14), 0 10px 30px rgba(22, 32, 28, .14);
  }
  .device.phone { border-radius: 22px; box-shadow: 0 0 0 7px #1d2422, 0 10px 30px rgba(22, 32, 28, .2); }
  .device.tablet { border-radius: 16px; box-shadow: 0 0 0 6px #1d2422, 0 10px 30px rgba(22, 32, 28, .18); }
  .device iframe { display: block; border: 0; width: 100%; height: 100%; background: #ECEFEE; }

  @media (max-width: 1000px) {
    body { height: auto; }
    html, body { height: auto; }
    .stage { grid-template-columns: minmax(0, 1fr); }
    .pane { height: 70vh; }
  }
</style>
</head>
<body>
  <header class="top">
    <h1>나의 책상 미리보기</h1>
    <span class="sp"></span>
    <button class="btn" type="button" id="reloadAll">모두 새로고침</button>
    <a class="btn main" href="./index.html" style="text-decoration:none">수첩으로</a>
  </header>
  <main class="stage" id="stage"></main>

<script>
(() => {
  "use strict";
  const DEVICES = [
    { id: "pc", name: "PC", cls: "pc", sizes: [
      { w: 1920, h: 1080, label: "1920×1080 모니터" },
      { w: 2560, h: 1440, label: "2560×1440 모니터" },
      { w: 1536, h: 864,  label: "1536×864 노트북" },
      { w: 1366, h: 768,  label: "1366×768 노트북" },
    ] },
    { id: "tablet", name: "태블릿", cls: "tablet", sizes: [
      { w: 1180, h: 820,  label: "아이패드 가로" },
      { w: 820,  h: 1180, label: "아이패드 세로" },
      { w: 1280, h: 800,  label: "갤럭시 탭 가로" },
      { w: 800,  h: 1280, label: "갤럭시 탭 세로" },
    ] },
    { id: "phone", name: "폰", cls: "phone", sizes: [
      { w: 390, h: 844, label: "아이폰" },
      { w: 360, h: 780, label: "갤럭시" },
      { w: 430, h: 932, label: "큰 아이폰" },
    ] },
  ];
  const SRC = "./index.html";
  const KEY = "my-desk-preview:";   // 고른 크기만 이 브라우저에 기억한다(학생 정보 아님)
  const remember = (k, v) => { try { localStorage.setItem(KEY + k, String(v)); } catch (e) {} };
  const recall = (k) => { try { return localStorage.getItem(KEY + k); } catch (e) { return null; } };

  const el = (tag, props, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const c of kids) if (c) n.append(c);
    return n;
  };

  const panes = DEVICES.map((D) => {
    let pick = Number(recall(D.id));
    if (!(pick >= 0 && pick < D.sizes.length)) pick = 0;
    const sel = el("select", { "aria-label": D.name + " 화면 크기", onchange: () => { pick = Number(sel.value); remember(D.id, pick); size(); fit(); } },
      ...D.sizes.map((s, i) => el("option", { value: String(i), text: s.label })));
    sel.value = String(pick);
    const scale = el("span", { class: "scale" });
    const frame = el("iframe", { src: SRC, title: D.name + " 미리보기" });
    const device = el("div", { class: "device " + D.cls }, frame);
    const screen = el("div", { class: "screen" }, device);
    const reload = el("button", { class: "btn", type: "button", text: "새로고침", onclick: () => { frame.src = SRC; } });
    const pane = el("section", { class: "pane", "aria-label": D.name },
      el("div", { class: "phead" }, el("b", { text: D.name }), sel, scale, el("span", { class: "sp" }), reload), screen);
    function size() {
      const s = D.sizes[pick];
      device.style.width = s.w + "px"; device.style.height = s.h + "px";
    }
    function fit() {
      const s = D.sizes[pick];
      const pad = D.cls === "pc" ? 2 : 10;     // 태블릿과 폰은 테두리 몫을 남긴다
      const k = Math.min(1, (screen.clientWidth - pad * 2) / s.w, (screen.clientHeight - pad * 2) / s.h);
      device.style.transform = `translate(${-s.w * k / 2}px, ${pad}px) scale(${k})`;
      scale.textContent = Math.round(k * 100) + "%";
    }
    size();
    new ResizeObserver(fit).observe(screen);
    return { pane, frame, fit };
  });
  document.getElementById("stage").append(...panes.map(p => p.pane));
  document.getElementById("reloadAll").addEventListener("click", () => { for (const p of panes) p.frame.src = SRC; });
})();
</script>
</body>
</html>
