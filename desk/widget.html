<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 책상 위젯</title>
<link rel="stylesheet" href="./desk.css">
<style>
/* 바탕화면에 깔리는 위젯. 암호가 걸리지 않은 것만 띄운다.
   출결, 수합, 상담, 업무는 암호문이라 비밀번호 없이는 읽을 수 없고,
   뒤로 사람이 지나가도 학생 이름이 보이지 않아야 하므로 일부러 올리지 않는다. */
body { background: transparent; }
.wg { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; height: 100vh; box-sizing: border-box; }
.wg-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
.wg-clock { font-family: var(--font-num); font-weight: 300; font-size: clamp(44px, 7vw, 84px); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.wg-clock .sec { font-size: 0.36em; color: var(--faint); margin-left: 6px; }
.wg-when { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.wg-date { font-size: 17px; font-weight: 600; }
.wg-now { font-size: 14px; color: var(--muted); }
.wg-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; min-height: 0; flex: 1; }
@media (max-width: 900px) { .wg-grid { grid-template-columns: minmax(0, 1fr); } }
.wg-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; min-width: 0; max-height: 100%; overflow: hidden; }
.wg-card h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); margin: 0; }
.wg-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
.wg-list li { font-size: 14px; display: flex; gap: 9px; align-items: baseline; }
.wg-list .k { font-family: var(--font-num); font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.wg-list .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wg-list li.now .v { color: var(--accent); font-weight: 600; }
.wg-list li.free .v { color: var(--faint); }
.wg-foot { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.wg-note { font-size: 12px; color: var(--faint); }
.wg-open { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 9px 18px; font-weight: 600; cursor: pointer; }
.wg-open:hover { filter: brightness(1.08); }
.wg-empty { font-size: 13px; color: var(--faint); }
</style>
</head>
<body>
<div class="wg">
  <div class="wg-top">
    <div>
      <div class="wg-clock" id="wClock">--:--<span class="sec">--</span></div>
    </div>
    <div class="wg-when">
      <div class="wg-date" id="wDate"></div>
      <div class="wg-now" id="wNow"></div>
    </div>
  </div>

  <div class="wg-grid">
    <section class="wg-card">
      <h2>오늘 시간표</h2>
      <ul class="wg-list" id="wPeriods"><li class="wg-empty">불러오는 중</li></ul>
    </section>
    <section class="wg-card">
      <h2>할 일</h2>
      <ul class="wg-list" id="wTodos"><li class="wg-empty">불러오는 중</li></ul>
    </section>
    <section class="wg-card">
      <h2>학사 일정</h2>
      <ul class="wg-list" id="wDdays"><li class="wg-empty">불러오는 중</li></ul>
    </section>
  </div>

  <div class="wg-foot">
    <span class="wg-note" id="wNote">출결, 수합, 상담은 잠겨 있습니다. 수첩을 열면 보입니다.</span>
    <button class="wg-open" type="button" id="wOpen">수첩 열기</button>
  </div>
</div>
<script type="module" src="./widget.js"></script>
</body>
</html>
