<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘, 교무노트</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./desk.css">
<script>
/* 모듈(desk.js)보다 먼저 떠야 모듈 오류까지 잡는다. */
window.__deskLog = [];
(function () {
  function show(kind, msg) {
    window.__deskLog.push(kind + ": " + msg);
    var box = document.getElementById("gateDiag");
    if (box) box.textContent = window.__deskLog.slice(-4).join(" / ");
  }
  window.__deskShow = show;
  window.addEventListener("error", function (e) {
    show("오류", (e.message || "알 수 없음") + (e.filename ? " @ " + String(e.filename).split("/").pop() + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason || {};
    show("처리 안 된 오류", (r.code ? r.code + " " : "") + (r.message || String(r)));
  });
})();
</script>
</head>
<body>

<div class="gate" id="gate">
  <form class="gate-card" id="gateForm" onsubmit="return false">
    <h1>오늘, 교무노트</h1>
    <label class="field">메일<input type="email" id="gateEmail" autocomplete="username" required></label>
    <label class="field">비밀번호<input type="password" id="gatePass" autocomplete="current-password" required></label>
    <p class="form-err" id="gateErr" role="alert"></p>
    <button class="btn" type="submit" id="gateBtn">들어가기</button>
  </form>
</div>

<div id="app" hidden>

<div class="deck" id="deck">

  <section class="wg" data-w="clock">
    <section class="card wg-clock">
      <div class="cw-time">
        <div class="clock" id="clock" aria-live="off">--:--<span class="sec">--</span></div>
        <div class="date-main" id="dateMain"></div>
      </div>
      <div class="cw-wx" id="wx"></div>
    </section>
  </section>

  <section class="wg" data-w="links">
    <section class="card wg-links">
      <nav class="links" id="links" aria-label="바로가기"></nav>
    </section>
  </section>

  <section class="wg" data-w="now">
    <section class="card now" id="nowCard" aria-live="polite" aria-labelledby="nowTitle">
      <div class="card-head">
        <h2 class="card-title" id="nowTitle">지금</h2>
        <span class="card-aside" id="nowAside"></span>
      </div>
      <div class="now-main" id="nowMain"></div>
      <div class="now-sub" id="nowSub"></div>
      <div class="now-bar" id="nowBarWrap"><i id="nowBar" style="width:0%"></i></div>
      <div class="now-next" id="nowNext"></div>
    </section>
  </section>

  <section class="wg" data-w="periods">
    <section class="card" aria-labelledby="todayTitle">
      <div class="card-head">
        <h2 class="card-title" id="todayTitle">오늘 시간표</h2>
        <span class="card-aside" id="todayAside"></span>
      </div>
      <ul class="periods" id="periods"></ul>
    </section>
  </section>

  <section class="wg" data-w="class">
    <section class="card" aria-labelledby="classTitle">
      <div class="card-head">
        <h2 class="card-title" id="classTitle">우리 반</h2>
        <div class="row">
          <button class="text-btn" type="button" id="rosterBtn" hidden>명단 편집</button>
          <button class="text-btn" type="button" id="hideBtn" hidden>이름 가리기</button>
          <button class="text-btn" type="button" id="lockBtn" hidden>잠그기</button>
        </div>
      </div>
      <div class="row" style="justify-content:space-between">
        <p class="class-name" id="className">우리 반</p>
        <div class="seg" id="classSeg" role="group" aria-label="우리 반 보기" hidden>
          <button type="button" data-tab="att" aria-pressed="true">출결</button>
          <button type="button" data-tab="col" aria-pressed="false">수합</button>
          <button type="button" data-tab="ann" aria-pressed="false">전달사항</button>
        </div>
      </div>
      <div class="class-pick" id="classPick" hidden></div>
      <div id="rosterEditor" hidden></div>
      <div id="classBody"></div>
    </section>
  </section>

  <section class="wg" data-w="book">
    <section class="card" id="bookCard" aria-labelledby="bookTitle">
      <div class="book-head">
        <h2 class="card-title" id="bookTitle">교무수첩</h2>
        <div class="book-seg" id="bookSeg" role="group" aria-label="수첩 보기">
          <button type="button" data-page="today" aria-pressed="true">오늘</button>
          <button type="button" data-page="student" aria-pressed="false">학생</button>
          <button type="button" data-page="consult" aria-pressed="false">상담 민원</button>
          <button type="button" data-page="lesson" aria-pressed="false">수업</button>
          <button type="button" data-page="work" aria-pressed="false">업무</button>
        </div>
      </div>
      <div id="bookBody"></div>
    </section>
  </section>

  <section class="wg" data-w="gcal">
    <section class="card" aria-labelledby="gcalTitle">
      <div class="card-head">
        <h2 class="card-title" id="gcalTitle">구글 캘린더</h2>
        <button class="text-btn" type="button" id="gcalBtn" hidden>연결</button>
      </div>
      <div id="gcalBody"></div>
    </section>
  </section>

  <section class="wg" data-w="todos">
    <section class="card wg-todo" aria-labelledby="todoTitle">
      <div class="card-head">
        <h2 class="card-title" id="todoTitle">업무 할 일</h2>
        <button class="text-btn" id="clearDone" type="button">완료 항목 지우기</button>
      </div>
      <div class="quad" id="todoQuad"></div>
    </section>
  </section>

  <section class="wg" data-w="ddays">
    <section class="card" aria-labelledby="ddayTitle">
      <div class="card-head">
        <h2 class="card-title" id="ddayTitle">학사 일정 D-day</h2>
        <button class="text-btn" type="button" id="calPaste">일정 붙여넣기</button>
      </div>
      <div id="calBox" hidden></div>
      <ul class="dday-list" id="ddayList"></ul>
      <form class="dday-form" id="ddayForm">
        <label class="sr" for="ddayName">일정 이름</label>
        <input type="text" id="ddayName" maxlength="60" autocomplete="off">
        <label class="sr" for="ddayDate">날짜</label>
        <input type="date" id="ddayDate">
        <button class="btn" type="submit">추가</button>
      </form>
    </section>
  </section>

  <section class="wg" data-w="memo">
    <section class="card memo-col" aria-labelledby="memoTitle">
      <div class="card-head">
        <h2 class="card-title" id="memoTitle">메모</h2>
        <span class="card-aside" id="memoStatus"></span>
      </div>
      <label class="sr" for="memo">메모</label>
      <textarea class="memo" id="memo"></textarea>
    </section>
  </section>

  <section class="wg" data-w="tt">
    <section class="card" aria-labelledby="weekTitle">
      <div class="card-head">
        <h2 class="card-title" id="weekTitle">주간 시간표</h2>
        <button class="btn small secondary" type="button" id="ttEdit">편집</button>
      </div>
      <div class="tt-bells" id="ttBells" hidden></div>
      <div class="tt-scroll"><table class="tt" id="tt"></table></div>
    </section>
  </section>

</div><!-- /deck -->

<div class="tools" id="tools">
  <span class="sync" id="sync">불러오는 중</span>
  <button class="tool" type="button" id="editLinks" title="바로가기 추가와 삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>바로가기 편집</button>
  <button class="tool" type="button" id="toPreview" title="PC, 태블릿, 폰을 한 화면에" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="13" height="10" rx="2"/><path d="M6.5 18h4"/><rect x="17" y="9" width="5" height="11" rx="1.5"/></svg>미리보기</button>
  <button class="tool" type="button" id="toWidget" title="바탕화면 위젯으로 내리기" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="12" y="12" width="7" height="6" rx="1"/></svg>위젯으로</button>
  <button class="tool" type="button" id="arrange" title="위젯 이동과 크기 조절"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>배치</button>
  <button class="tool" type="button" id="toolSet" title="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>설정</button>
  <button class="tool" type="button" id="signOut" title="수첩에서 나가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>나가기</button>
</div>

<div class="pagebar" id="pagebar"></div>

<div class="scrim" id="setScrim" hidden></div>
<section class="card float" id="setPanel" hidden aria-labelledby="setTitle"></section>

</div><!-- /app -->

<script type="module" src="./desk.js"></script>
</body>
</html>
