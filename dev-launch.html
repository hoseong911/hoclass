<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOCLASS 동시 보기</title>
<!--
  개발용 동시 보기(2026-11-08). 학생 화면(index.html)과 어드민(admin.html)을 한 창에 좌/우로 나란히 띄운다.
  인증을 내고 바로 검토하는 흐름을 한눈에 본다. ES 모듈 앱이라 http로 열어야 한다(node dev-server.js → localhost:8777).
  좁은 화면에서는 위아래로 쌓인다. 배포 대상 아님.
-->
<style>
  :root{ --navy:#041E42; --line:#DDE2E9; --sub:#68727F; --bar:38px; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ display:flex; flex-direction:column; background:#fff;
    font-family:Pretendard,system-ui,sans-serif; color:var(--navy); }
  .split{ flex:1; display:flex; min-height:0; }
  .pane{ flex:1; min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  .pane:last-child{ border-right:0; }
  .pbar{ height:var(--bar); flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:0 12px; background:#F4F5F7; border-bottom:1px solid var(--line); font-size:13px; }
  .pbar b{ font-weight:600; letter-spacing:.3px; }
  .pbar .sp{ flex:1; }
  .pbar button{ font-family:inherit; font-size:12px; cursor:pointer; border:1px solid var(--line);
    background:#fff; color:var(--sub); border-radius:6px; padding:4px 10px; }
  .pbar button:hover{ color:var(--navy); border-color:var(--navy); }
  iframe{ flex:1; width:100%; border:0; background:#fff; }
  @media (max-width:860px){ .split{ flex-direction:column; } .pane{ border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
  <div class="split">
    <div class="pane">
      <div class="pbar"><b>학생 화면</b><span class="sp"></span>
        <button data-reload="stu">새로고침</button>
        <button data-pop="index.html">새 창</button></div>
      <iframe id="stu" src="index.html" title="학생 화면"></iframe>
    </div>
    <div class="pane">
      <div class="pbar"><b>어드민</b><span class="sp"></span>
        <button data-reload="adm">새로고침</button>
        <button data-pop="admin.html">새 창</button></div>
      <iframe id="adm" src="admin.html" title="어드민"></iframe>
    </div>
  </div>
<script>
  document.addEventListener('click', e => {
    const r = e.target.dataset.reload, p = e.target.dataset.pop;
    if (r){ const f = document.getElementById(r); f.src = f.src; }       // 그 쪽만 다시 읽기
    if (p){ window.open(p, '_blank', 'popup=yes,width=520,height=900'); } // 별도 창이 필요하면
  });
</script>
</body>
</html>
